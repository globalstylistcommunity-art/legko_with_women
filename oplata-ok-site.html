<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оплата прошла</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@800;900&display=swap">
<style>
:root{--bg:#12030a;--rb:#8e0a33;--rbl:#e8406e;--rbc:142,10,51;--rbg:linear-gradient(135deg,#b8174f,#8e0a33 55%,#5e0420);--ink:#fff;--muted:#c9b3b8;--wide:'Unbounded','Manrope',system-ui,sans-serif;--body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;color:var(--ink);font:400 16px/1.6 var(--body);padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse 70% 45% at 85% 8%,rgba(142,10,51,.4),transparent 70%),radial-gradient(ellipse 70% 40% at 10% 90%,rgba(142,10,51,.32),transparent 70%),linear-gradient(180deg,#1a0409,#12030a 50%,#1a0409)}
.ok{width:100%;max-width:620px;text-align:center}
.ph{position:relative;display:block;width:150px;aspect-ratio:4/5;margin:0 auto 34px}
.ph:before{content:"";position:absolute;inset:0;transform:translate(10px,10px);border:1.5px solid var(--rbl);border-radius:16px}
.ph img{position:relative;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;border-radius:16px;box-shadow:0 20px 40px -16px rgba(var(--rbc),.9)}
.check{display:inline-grid;place-items:center;width:46px;height:46px;margin-bottom:14px;border-radius:50%;background:var(--rbg);font:800 22px/1 var(--body);box-shadow:0 0 0 6px rgba(var(--rbc),.25)}
h1{margin:0;font:900 clamp(24px,5vw,38px)/1.2 var(--wide);text-transform:uppercase;text-wrap:balance}
h1 .pl{display:inline-block;padding:.08em .35em;background:var(--rbg)}
.sub{margin:14px 0 0;font:800 clamp(13px,2.2vw,17px)/1.35 var(--wide);text-transform:uppercase}
.card{margin:28px 0 0;padding:26px 24px;border-radius:22px;background:linear-gradient(160deg,rgba(60,8,26,.75),rgba(22,4,10,.85));border:1px solid rgba(var(--rbc),.8);box-shadow:0 30px 60px -30px rgba(var(--rbc),.8);text-align:left}
.card ol{list-style:none;counter-reset:s;margin:0 0 22px;padding:0;display:grid;gap:14px}
.card li{counter-increment:s;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;font-size:15.5px;color:#f1e4e7}
.card li:before{content:"0" counter(s);font:900 26px/1 var(--wide);color:transparent;-webkit-text-stroke:1.3px var(--rbl)}
.card b{color:#fff}
.go{display:flex;align-items:center;justify-content:center;gap:10px;padding:17px 20px;border-radius:14px;background:var(--rbg);color:#fff;text-decoration:none;font:800 14px/1 var(--wide);text-transform:uppercase;letter-spacing:.02em;box-shadow:0 16px 34px -14px rgba(var(--rbc),1);transition:transform .2s}
.go:hover{transform:translateY(-2px)}
.help{margin:26px 0 0;font-size:14px;color:var(--muted)}
.mail{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:8px}
.mail span{font:800 15px/1 var(--wide);color:#fff;user-select:all;word-break:break-all}
.mail button{padding:7px 12px;border-radius:10px;border:0;background:var(--rbg);color:#fff;font:700 12px var(--body);cursor:pointer}
@media(prefers-reduced-motion:reduce){.go{transition:none}}
</style>
</head>

<script>
/* адрес практикума (страница входа по почте) — вставить ссылку GitHub Pages */
const COURSE_URL = '';

if (COURSE_URL) { go.href = COURSE_URL; } else go.addEventListener('click', e => e.preventDefault());

  const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('m')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
